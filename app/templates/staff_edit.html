
{% extends 'base.html' %}
{% block content %}
<h2>Edit Staff</h2>
<form method="post" action="/staff/{{ staff.staff_id }}/edit">
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input class="form-control" name="name" value="{{ staff.name }}" />
  </div>
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input class="form-control" name="email" value="{{ staff.email or '' }}" />
  </div>
  <button class="btn btn-success">Update</button>
  <a class="btn btn-secondary" href="/staff">Cancel</a>
</form>
{% endblock %}
