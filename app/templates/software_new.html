
{% extends 'base.html' %}
{% block content %}
<h2>Add Software</h2>
<form method="post" action="/software/new">
  <div class="mb-3">
    <label class="form-label">Computer</label>
    <select class="form-select" name="computer_id" required>
      {% for c in computers %}
        <option value="{{ c.computer_id }}">{{ c.comp_name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Software Name</label>
    <input class="form-control" name="software_name" required />
  </div>
  <button class="btn btn-success">Save</button>
  <a class="btn btn-secondary" href="/software">Cancel</a>
</form>
{% endblock %}
